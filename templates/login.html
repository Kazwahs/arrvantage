<!DOCTYPE html>
<html lang="en" data-theme="{{ current_theme }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in - arrVantage</title>
    <link rel="icon" href="/static/icons/favicon.svg" type="image/svg+xml">
    {% include "partials/theme_head.html" %}
    <link rel="preload" href="{{ url_for('static', filename='fonts/Geist-Variable.woff2') }}" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="{{ asset_url('css/app.css') }}">
    <script>
        // Signed-out pages have no account to read a theme from, so use the one this browser last chose.
        try {
            var saved = localStorage.getItem('arrTheme');
            if (saved && {{ themes.keys()|list|tojson }}.indexOf(saved) !== -1) document.documentElement.setAttribute('data-theme', saved);
        } catch (e) {}
    </script>
    <style>
        html, body { height: 100%; margin: 0; }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            color: var(--text);
        }
        .box {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 2rem;
            width: 100%;
            max-width: 320px;
        }
        h1 { font-size: 1.2rem; margin: 0 0 1.25rem 0; text-align: center; }
        label { display: block; font-size: 0.78rem; color: var(--muted); margin-bottom: 0.3rem; }
        .field { margin-bottom: 1rem; }
        input[type="text"], input[type="password"] {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 0.55rem 0.7rem;
            color: var(--text);
            font-size: 0.9rem;
        }
        .error {
            background: color-mix(in srgb, var(--error) 12%, transparent);
            border: 1px solid var(--error);
            color: var(--error-text);
            border-radius: 6px;
            padding: 0.6rem 0.8rem;
            font-size: 0.82rem;
            margin-bottom: 1rem;
        }
        button {
            width: 100%;
            background: var(--accent);
            border: none;
            border-radius: 8px;
            color: var(--on-accent);
            font-size: 0.9rem;
            font-weight: 600;
            padding: 0.65rem;
            cursor: pointer;
            margin-top: 0.5rem;
        }
        button:hover { background: var(--accent-hover); }
    </style>
</head>
<body>
    <div class="box">
        <h1>arrVantage</h1>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <form method="POST" action="/login">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <div class="field">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" autofocus>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password">
            </div>
            <button type="submit">Log In</button>
        </form>
    </div>
</body>
</html>
