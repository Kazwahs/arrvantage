services:
  arrvantage:
    # Pre-built by GitHub Actions on every push to main (see
    # .github/workflows/docker-build.yml), rather than building from a
    # git URL directly - this sidesteps the build-cache staleness
    # issues we hit repeatedly with the old git-build-context approach.
    # Replace "kazwahs" if your GitHub username differs.
    image: ghcr.io/kazwahs/arrvantage:latest
    # Always checks the registry for a newer :latest on every redeploy,
    # rather than silently reusing whatever image happens to already
    # be cached locally - this is what makes "just redeploy in TrueNAS"
    # reliably pick up new pushes without any manual pull/rebuild step.
    pull_policy: always
    container_name: arrvantage
    restart: unless-stopped
    ports:
      # Left side is the port on your host/reverse proxy - change it
      # to whatever fits your setup (e.g. a NodePort-style 30xxx port
      # if that matches how your other *arr containers are exposed).
      # Right side (5000) is the app's own internal port, matching the
      # PORT env var below - if you change PORT, change this side to
      # match, or the mapping won't line up with what's actually
      # listening inside the container.
      - "5000:5000"
    volumes:
      # Bind-mount to an actual TrueNAS dataset path rather than a
      # relative "./data" - keeps config.json on real ZFS storage so
      # it's included in your normal dataset snapshots/backups, and
      # survives image updates. Create the dataset first, then use
      # its real path here, e.g.:
      # - /mnt/yourpool/apps/arrvantage/data:/app/data
      - ./data:/app/data
    environment:
      - CONFIG_DIR=/app/data
      # Flip to "true" once your reverse proxy + SSL cert are confirmed
      # working end-to-end - this makes the login cookie HTTPS-only.
      - FORCE_HTTPS_COOKIES=false
      # Only needed if 5000 conflicts with something else - most setups
      # can leave this out entirely and rely on the built-in default.
      # - PORT=5000
