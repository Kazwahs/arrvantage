<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 100">
  <!-- Shield emblem -->
  <path d="M55,15 L105,15 L105,45 Q105,58 80,68 Q55,58 55,45 Z"
        fill="none" stroke="#5b8cff" stroke-width="3" stroke-linejoin="round"/>

  <!-- Mountain peak (the "vantage point") -->
  <path d="M80,24 L96,52 L64,52 Z" fill="#5b8cff"/>
  <path d="M80,24 L87,38 L73,38 Z" fill="#e4e6eb"/>

  <!-- Radiating light bursting past the frame -->
  <g stroke="#5b8cff" stroke-width="2.5" stroke-linecap="round">
    <line x1="80" y1="20" x2="80" y2="8"/>
    <line x1="71" y1="22" x2="61" y2="12"/>
    <line x1="89" y1="22" x2="99" y2="12"/>
  </g>

  <!-- Wordmark -->
  <text x="80" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" letter-spacing="0.5">
    <tspan font-weight="600" fill="#8b93a3">arr</tspan><tspan font-weight="800" fill="#e4e6eb">Vantage</tspan>
  </text>
</svg>
