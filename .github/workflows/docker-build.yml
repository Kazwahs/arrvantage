name: Build and Publish Docker Image

# Runs the test suite first - the build/publish job only starts if
# tests pass, so a broken change can't reach the registry (and from
# there, TrueNAS via pull_policy: always) even if it was accidentally
# pushed to main.
#
# Two triggers:
# - push to main: publishes :latest and :sha-xxxxx, same as always.
# - a published GitHub Release (e.g. v1.0.0): additionally tags the
#   image with that exact version, so ghcr.io/.../arrvantage:v1.0.0
#   becomes a real, pullable, pinned tag - matching what most other
#   apps in TrueNAS's catalog use, and what its own update-tracking
#   bot is built around. This only applies going forward - it can't
#   retroactively tag a release published before this existed.
#
# The image is built for amd64 (what TrueNAS and most PCs use) and arm64
# (Raspberry Pi, Apple silicon, ARM servers). Nobody on this project has an
# ARM machine, so before anything is pushed the arm64 image is built, started
# under emulation (QEMU) and asked for /health: a build that does not boot on
# ARM stops the release the same way a failing test does.

on:
  push:
    branches: [main]
  release:
    types: [published]

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU (lets this runner run arm64 containers)
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the arm64 image for a smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          load: true
          push: false
          tags: arrvantage-smoke:arm64
          cache-from: type=gha,scope=arrvantage
          cache-to: type=gha,scope=arrvantage,mode=max

      - name: Smoke test the arm64 image (it must start and answer /health)
        run: |
          set -euo pipefail
          arch="$(docker image inspect arrvantage-smoke:arm64 --format '{{.Architecture}}')"
          echo "Image architecture: ${arch}"
          test "${arch}" = "arm64"
          docker run -d --name arrv-smoke --platform linux/arm64 -p 5000:5000 arrvantage-smoke:arm64
          # Emulated ARM is slow to start; allow up to 3 minutes.
          for attempt in $(seq 1 60); do
            if [ "$(docker inspect -f '{{.State.Running}}' arrv-smoke)" != "true" ]; then
              echo "::error::The arm64 container stopped before it answered"
              docker logs arrv-smoke
              exit 1
            fi
            if curl -fsS http://127.0.0.1:5000/health; then
              echo
              echo "Machine reported inside the container: $(docker exec arrv-smoke python -c 'import platform; print(platform.machine())')"
              echo "The arm64 image started and answered /health"
              docker rm -f arrv-smoke
              exit 0
            fi
            sleep 3
          done
          echo "::error::The arm64 container did not answer /health within 3 minutes"
          docker logs arrv-smoke
          exit 1

      - name: Compute image name and short SHA
        id: vars
        run: |
          echo "image_name=$(echo '${{ env.REGISTRY }}/${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push image (push to main)
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # No provenance/SBOM attachments: they add extra entries to the image index
          # that this project has never had, and nothing here reads them.
          provenance: false
          sbom: false
          cache-from: type=gha,scope=arrvantage
          cache-to: type=gha,scope=arrvantage,mode=max
          push: true
          tags: |
            ${{ steps.vars.outputs.image_name }}:latest
            ${{ steps.vars.outputs.image_name }}:sha-${{ steps.vars.outputs.sha_short }}

      - name: Build and push image (release)
        if: github.event_name == 'release'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # No provenance/SBOM attachments: they add extra entries to the image index
          # that this project has never had, and nothing here reads them.
          provenance: false
          sbom: false
          cache-from: type=gha,scope=arrvantage
          cache-to: type=gha,scope=arrvantage,mode=max
          push: true
          tags: |
            ${{ steps.vars.outputs.image_name }}:latest
            ${{ steps.vars.outputs.image_name }}:${{ github.event.release.tag_name }}